name: 08.1.3-Context-Env-Vars-Secrets

on:
  workflow_dispatch:

env:
  APP_NAME: i27academy-devops-dashboard
  REGISTRY: docker.io

jobs:
  context-demo:
    runs-on: ubuntu-latest
    env:
      JOB_ENV: job-level-value
    steps:
      - name: Print env.* context
        run: |
          echo "============================="
          echo "env.* CONTEXT"
          echo "============================="
          echo "APP_NAME  : ${{ env.APP_NAME }}"
          echo "REGISTRY  : ${{ env.REGISTRY }}"
          echo "JOB_ENV   : ${{ env.JOB_ENV }}"
          echo "============================="
          echo "Note: env.* works in expressions"
          echo "      outside run: blocks too"

      - name: Print vars.* context
        run: |
          echo "============================="
          echo "vars.* CONTEXT"
          echo "============================="
          echo "DEPLOY_ENV : ${{ vars.DEPLOY_ENV }}"
          echo "============================="
          echo "Note: vars.* are set in GitHub UI Settings"
          echo "      visible in logs — not masked"

      - name: Print secrets.* context
        run: |
          echo "============================="
          echo "secrets.* CONTEXT"
          echo "============================="
          echo "MY_SECRET      : ${{ secrets.MY_SECRET }}"
          echo "GITHUB_TOKEN   : ${{ secrets.GITHUB_TOKEN != '' }}"
          echo "============================="
          echo "Note: secrets.* are always masked in logs"

      - name: Use env.* in if condition
        if: env.APP_NAME == 'i27academy-devops-dashboard'
        run: echo "Condition using env.* context works ✅"
