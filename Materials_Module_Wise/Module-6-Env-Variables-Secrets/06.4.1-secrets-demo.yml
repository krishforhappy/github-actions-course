name: 06.4.1-Secrets-Demo

# Before running this workflow, create this secret in GitHub:
# Repo → Settings → Secrets and variables → Actions → Secrets tab
#   MY_SECRET = any-value-you-want

on:
  workflow_dispatch:

jobs:
  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets are masked in logs
        run: |
          echo "============================="
          echo "SECRETS MASKING DEMO"
          echo "============================="
          echo "MY_SECRET : ${{ secrets.MY_SECRET }}"
          echo "Above line shows *** in logs — never the real value"
          echo "============================="

      - name: Safe pattern — assign to env var first
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Secret length : ${#MY_SECRET}"
          echo "Secret is set : ${{ secrets.MY_SECRET != '' }}"
          echo "Never print the secret directly — use length or is-set check"

      - name: GITHUB_TOKEN — auto created every run
        run: |
          echo "============================="
          echo "GITHUB_TOKEN"
          echo "============================="
          echo "GITHUB_TOKEN is set : ${{ secrets.GITHUB_TOKEN != '' }}"
          echo "This token is auto-created for every workflow run"
          echo "No setup needed — GitHub provides it automatically"
          echo "Used for: API calls, creating releases, commenting on PRs"
          echo "============================="

  environment-secrets-demo:
    runs-on: ubuntu-latest
    environment: staging          # unlocks environment-level secrets
    steps:
      - name: Environment secrets
        run: |
          echo "============================="
          echo "ENVIRONMENT SECRETS"
          echo "============================="
          echo "This job targets the 'staging' environment"
          echo "Environment secrets are only accessible"
          echo "when environment: is declared on the job"
          echo "============================="

# ════════════════════════════════════════════════════════════
# Three levels of secrets:
#   Repository secrets  → all workflows in this repo
#   Environment secrets → only jobs with matching environment:
#   Organization secrets → shared across multiple repos
#
# GITHUB_TOKEN:
#   → Auto-created for every workflow run
#   → No setup needed
#   → Access via secrets.GITHUB_TOKEN
#   → Used for GitHub API calls within the workflow
#
# Secrets masking:
#   → GitHub replaces secret values with *** in logs
#   → Even if you accidentally print a secret it shows ***
#   → Safe pattern: assign to env var, check length or is-set
# ════════════════════════════════════════════════════════════
