name: 11.2.2-Matrix-Fail-Fast-Max-Parallel

on:
  workflow_dispatch:

jobs:

  # ── fail-fast: false — see ALL results ─────────────────────
  test-all-results:
    name: Test (fail-fast false) - Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # keep running all jobs even if one fails
      max-parallel: 2           # run at most 2 jobs at a time
      matrix:
        java-version: [ '17', '21' ]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven
      - name: Run tests
        run: mvn test
      - name: Show configuration
        run: |
          echo "Java version  : ${{ matrix.java-version }}"
          echo "fail-fast     : false"
          echo "max-parallel  : 2"

# ════════════════════════════════════════════════════════════
# fail-fast: true (default)
#   → One job fails → all other matrix jobs cancelled immediately
#   → Use when: you want fast feedback
#   → "Something is broken — stop everything"
#
# fail-fast: false
#   → One job fails → other matrix jobs continue running
#   → Use when: you want to see ALL results
#   → "Show me which Java versions pass and which fail"
#
# max-parallel:
#   → Limits how many matrix jobs run at the same time
#   → Default: all run in parallel
#   → Use when: limited runners or resource constraints
# ════════════════════════════════════════════════════════════
