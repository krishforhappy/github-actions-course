name: 11.3.1-Matrix-Dynamic

on:
  workflow_dispatch:

jobs:

  # ── Job 1: Generate the matrix ──────────────────────────────
  prepare-matrix:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set dynamic matrix
        id: set-matrix
        run: |
          echo 'matrix={"java-version":["17","21"],"include":[{"java-version":"21","is-lts":true},{"java-version":"17","is-lts":false}]}' >> $GITHUB_OUTPUT

      - name: Show generated matrix
        run: |
          echo "Generated matrix:"
          echo '${{ steps.set-matrix.outputs.matrix }}'

  # ── Job 2: Use the dynamic matrix ───────────────────────────
  test:
    name: Test - Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven
      - name: Run tests
        run: mvn test
      - name: LTS marker
        if: matrix.is-lts == true
        run: echo "Java ${{ matrix.java-version }} is LTS ✅"
      - name: Show matrix values
        run: |
          echo "Java version : ${{ matrix.java-version }}"
          echo "Is LTS       : ${{ matrix.is-lts }}"

# ════════════════════════════════════════════════════════════
# Why dynamic matrix?
#
# Static matrix:
#   → Values hardcoded in YAML
#   → Change versions = edit the workflow file
#
# Dynamic matrix:
#   → Values computed at runtime
#   → Can come from an API, a file, or computed logic
#   → Change versions = update the source, not the workflow
#
# Real world use:
#   → List of microservices to build/deploy
#   → List of environments from a config file
#   → Java versions from a supported versions API
# ════════════════════════════════════════════════════════════
